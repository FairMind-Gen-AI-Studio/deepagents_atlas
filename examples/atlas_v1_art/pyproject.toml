[project]
name = "atlas-v1-art"
version = "0.1.0"
description = "Atlas V1 Agent with OpenPipe ART reinforcement learning integration"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [
    {name = "Atlas Development Team"}
]

dependencies = [
    # Core LangChain dependencies
    "langchain>=0.2.0",
    "langgraph>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "langchain-openai>=0.1.0",
    
    # Configuration and utilities
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    
    # Data processing
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "jsonlines>=3.1.0",
    
    # Visualization (optional)
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
# OpenPipe ART integration (install separately due to dependency conflicts)
art = [
    "openpipe-art>=0.4.8",
    "wandb>=0.15.0",
    "weave>=0.50.0",
]

# Training features
training = [
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
]

# Development tools
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

# LangGraph CLI for development
cli = [
    "langgraph-cli>=0.1.0",
]

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*", "docs*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]  # Line too long - handled by black

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# Installation instructions
# -------------------------
# Basic installation (without OpenPipe ART):
#   pip install -e .
#
# With OpenPipe ART (may have compatibility issues):
#   pip install -e ".[art]"
#
# For development:
#   pip install -e ".[dev,cli]"
#
# If OpenPipe ART fails to install:
#   pip install openpipe-art --no-deps
#   pip install wandb weave gql graphql-core
#
# To run with LangGraph:
#   pip install -e ".[cli]"
#   langgraph dev